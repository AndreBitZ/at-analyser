name: DMG Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "server/**"
      - "src/**"
      - ".github/workflows/mac-dmg.yml"

jobs:
  dmg:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install
        working-directory: macos
      - run: npx electron-builder --mac --arm64
        working-directory: macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: AT-Analyser-apple-silicon
          path: |
            release/*.dmg
            macos/release/*.dmg
          if-no-files-found: warn
